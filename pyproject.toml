[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-srd-2024"
version = "0.4.0"
description = "Zero-server, agent-native 5e 2024 (SRD 5.2) SQLite, Markdown card, CLI, and MCP pack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
srd-build = "srd2024.compiler.__main__:main"
srd = "srd2024.runtime.cli:main"
srd-mcp = "srd2024.runtime.mcp:main"
srd-rules-build = "srd2024.rules_compiler.__main__:main"
srd-engine-mcp = "srd2024.runtime.mcp:main_engine"
srd-arena = "srd2024.runtime.arena_bridge:main_arena"
srd-dst = "srd2024.testing.dst:main_dst"
srd-mutate = "srd2024.testing.mutate:main_mutate"

[tool.setuptools.packages.find]
where = ["src"]
