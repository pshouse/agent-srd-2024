name: Bug
description: Report a problem in the CLI, MCP server, or static site.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Issues may be triaged by an automated agent; do not include secrets or personal data."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, requests, or clicks that show the problem.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release, tag, or commit SHA.
      placeholder: main or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where you saw it.
      options:
        - CLI
        - MCP
        - web
    validations:
      required: true
