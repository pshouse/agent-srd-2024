name: Feature
description: Suggest a change to behavior.
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: "Issues may be triaged by an automated agent; do not include secrets or personal data."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: What should it do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.
    validations:
      required: false
