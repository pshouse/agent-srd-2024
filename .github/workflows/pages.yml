# GitHub Pages deploy. Not live.
# Trigger is workflow_dispatch only. This file does not enable Pages and
# must not be dispatched until the CTO and Patrick sign off.
# See docs/SECURITY-PAGES.md and docs/adr/0002-pages-deploy-gates.md.

name: pages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  main-only:
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless this ref is main or a release tag
        run: |
          case "${GITHUB_REF}" in
            refs/heads/main|refs/tags/*) ;;
            *)
              echo "Pages deploys only from refs/heads/main or a release tag (got ${GITHUB_REF})."
              exit 1
              ;;
          esac

  build:
    needs: main-only
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && needs.main-only.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Node tests
        run: node --disable-warning=ExperimentalWarning --test

      - name: Python tests
        run: PYTHONPATH=src python -m unittest discover -s tests -q

      - name: Assemble the Pages tree
        run: python3 scripts/site_files.py assemble _site

      - name: Allowlist check
        run: scripts/check_site.sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: _site

  # deploy-pages lists artifacts through the Actions results service. In the
  # same job as the upload, that list can be empty in the same second the
  # artifact is finalized (run 45932195143). This job does not start until
  # build has finished. It does not get actions: read: deploy-pages v4.0.1
  # and later use the results client instead of the Actions REST API.
  deploy:
    needs: build
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
